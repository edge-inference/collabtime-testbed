# =============================================================================
# Context-Fabric Testbed Configuration  (single source of truth)
#
# Consumed by:
#   scripts/gen_lf.py       -> LF federation sizes (federates per fleet)
#   scripts/gen_graph.py    -> warehouse_graph.yaml
#   scripts/gen_compose.py  -> docker-compose.<N>.yml
#   scripts/run_sweep.sh    -> sweep driver
#   scripts/task_spawner.py -> Poisson task stream
#   scripts/report.py       -> result tables + figures
#
# Goal: emulate N robots (each = LF federate + bridge + DSM + agent) in Docker
# containers and measure the 4 thesis metrics (completion rate, throughput,
# latency, utilization) + real coordination overhead (T_claim, T_prop / AoI).
# =============================================================================

# Fleet sizes to sweep. Each value compiles its own LF federation (size is
# fixed at LF compile time) and gets its own docker-compose.<N>.yml.
fleet_sizes: [2, 4, 8, 16]

federation:
  id: context-fabric-testbed-2025
  # With docker `network_mode: host`, every container shares the host network
  # namespace, so loopback reaches the RTI and federate P2P. Override if you
  # split federates across physical machines.
  rti_host: "127.0.0.1"
  rti_port: 15045

ros_domain_id: 42

run:
  duration_s: 300        # wall-clock seconds the task spawner runs per fleet size
  seed: 42               # default Poisson seed (single-seed runs / smoke)
  seeds: [42, 1, 7]      # seeds swept by run_sweep for mean +/- sd statistics
  warmup_s: 10           # grace period after bring-up before spawning tasks

# Robot timing. Defaults match the thesis simulation so testbed numbers are
# interpretable on the same scale (cell = 1 m, v = 0.5 m/s -> 2 s/cell; 45 s work).
timing:
  step_time_s: 2.0       # virtual time to traverse one graph edge
  work_time_s: 45.0      # work duration at a task location
  tick_rate_ms: 100      # agent state-machine tick

# Poisson task arrivals: lambda(N) = arrival_rate_per_robot * N  (tasks/sec).
# Service time per task ~= nav (~30 s) + work (45 s) ~= 75 s, so per-robot
# capacity ~= 1/75 ~= 0.0133/s. 0.009 targets ~68% offered load (below
# saturation) so completion rate is meaningful, not gridlocked. Tune after a
# smoke run.
tasks:
  arrival_rate_per_robot: 0.009
  task_type: pick
  priority: 1.0

# Warehouse graph (generated by gen_graph.py). Sized so that even the largest
# fleet stays at warehouse-like density (~4-5 %), avoiding gridlock.
graph:
  path: config/warehouse_graph.yaml
  container_path: /ros2_ws/config/warehouse_graph.yaml
  rows: 20
  cols: 20               # 400 cells; N=16 -> 4 % density
  border_type: staging   # perimeter cells (idle/clearing/start positions)
  interior_type: work    # interior cells are task targets

# Coordination mode: "lf" (federated, deterministic) is the thesis architecture.
# "zk" (centralized coord_node) is available as a baseline but not swept by default.
mode: lf

# Where run artifacts land on the host (mounted into the metrics container).
output:
  logs_dir: logs         # raw per-run CSV/JSON from metrics_node
  results_dir: results   # aggregated tables
  figures_dir: figures/testbed
